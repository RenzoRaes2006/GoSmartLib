stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:latest
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:latest
  DOCKER_TLS_CERTDIR: "" 

.docker-build-template:
  image: docker:cli
  stage: build
  tags:
    - docker
  services:
    - name: docker:dind
      command: ["--insecure-registry=registry.gitlab.apstudent.be"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

build-backend:
  extends: .docker-build-template
  script:
    - docker build --pull -t "$BACKEND_IMAGE" ./backend
    - docker push "$BACKEND_IMAGE"
  rules:
    - changes:
        - backend/**/*

build-frontend:
  extends: .docker-build-template
  script:
    - docker build --pull -t "$FRONTEND_IMAGE" ./frontend
    - docker push "$FRONTEND_IMAGE"
  rules:
    - changes:
        - frontend/**/*

deploy-to-server:
  stage: deploy
  tags:
    - docker
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker compose pull
    - docker compose up -d
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH