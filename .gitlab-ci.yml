stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG

.docker-build-template:
  image: docker:27.5.1
  stage: build
  tags:
    - vm-runner
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

build-backend:
  extends: .docker-build-template
  script:
    - docker build --pull -t "$BACKEND_IMAGE" ./backend
    - docker push "$BACKEND_IMAGE"
  rules:
    - changes:
        - backend/**/*

build-frontend:
  extends: .docker-build-template
  script:
    - docker build --pull -t "$FRONTEND_IMAGE" ./frontend
    - docker push "$FRONTEND_IMAGE"
  rules:
    - changes:
        - frontend/**/*

deploy-to-server:
  stage: deploy
  image: docker:27.5.1
  tags:
    - vm-runner
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker network create proxy || true
    - docker compose -f traefik/docker-compose.yaml up -d --build
    - docker compose pull
    - docker compose up -d --build
  rules:
    - if: $CI_COMMIT_BRANCH == "refactor-130-GroteOpruim"