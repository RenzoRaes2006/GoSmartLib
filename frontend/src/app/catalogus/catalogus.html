<div class="catalogus-container">
    <h3>{{ boekenlijst.length }} resultaten</h3>

    <div class="boeken-grid">

        <!-- <div class="boek-card" *ngFor="let boek of boekenlijst" [routerLink]="['/details', boek.isbn]"> -->
        <!-- toegevoegd door Mohamed-->
        <div class="boek-card" *ngFor="let boek of boekenlijst" [routerLink]="['/details', boek.id]">
        <!-- eind toegevoegd door Mohamed-->
            <div class="image-container">
                <span class="locatie-badge">{{ boek.locatie }}</span>
                <span class="status-badge" [ngClass]="boek.aantalExemplaren !== '0' ? 'beschikbaar' : 'uitgeleend'">
                    {{ boek.aantalExemplaren !== '0' ? 'Beschikbaar' : 'Uitgeleend' }}
                </span>
                <img [src]="boek.afbeelding" alt="Cover">
            </div>

            <div class="boek-info">
                <h4 class="titel">{{ boek.titel }}</h4>
                <p class="auteur">{{ boek.auteur }}</p>
                <p class="genres">
                    <small *ngFor="let g of boek.genre; let last = last">
                        {{ g }}{{ !last ? ' • ' : '' }}
                    </small>
                </p>
                <p class="pagina-info">{{ boek.pagina }} pagina's</p>
            </div>
        </div>
    </div>
</div>
