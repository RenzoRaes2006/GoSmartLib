<div class="reading-list-container">
  
  <div class="header-section">
    <h1>Mijn Favorieten & Leeslijsten</h1>
  </div>

  <div class="book-grid">
    @for (boek of testBoeken; track boek.id) {
      <div class="book-card">
        <div class="image-container">
          <img [src]="boek.afbeelding || 'https://via.placeholder.com/180x240?text=Geen+Cover'" 
               class="book-image" 
               alt="Cover">
          
          <button class="delete-btn" (click)="verwijderBoek(boek.id)">✕</button>
        </div>
        <div class="book-title">{{ boek.titel }}</div>
      </div>
    }

    <a routerLink="/catalogus" class="add-placeholder">
      <div class="add-icon">📚</div>
      <div class="add-text">Voeg boek toe</div>
    </a>
  </div>

  @if (testBoeken.length === 0) {
    <div style="margin-top: 40px; text-align: center; color: #999;">
      Je leeslijst is momenteel leeg.
    </div>
  }
</div>
