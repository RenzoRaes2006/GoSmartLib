<div class="login-container">
  <div class="login-card">
    <h1>Welkom bij GO! SmartLib</h1>
    <p>Aanmelden als admin</p>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="gebruikersnaam">Gebruikersnaam</label>
        <input
          id="gebruikersnaam"
          type="text"
          [(ngModel)]="gebruikersnaam"
          name="gebruikersnaam"
          required
          autocomplete="username"
          placeholder="Gebruikersnaam"
        />
      </div>

      <div class="form-group">
        <label for="wachtwoord">Wachtwoord</label>
        <input
          id="wachtwoord"
          type="password"
          [(ngModel)]="wachtwoord"
          name="wachtwoord"
          required
          autocomplete="current-password"
          placeholder="Wachtwoord"
        />
      </div>

      @if (foutmelding) {
        <p class="foutmelding">{{ foutmelding }}</p>
      }

      <button type="submit" class="login-btn" [disabled]="bezig || !gebruikersnaam || !wachtwoord">
        {{ bezig ? 'Bezig met inloggen...' : 'Aanmelden' }}
      </button>
    </form>
  </div>
</div>
