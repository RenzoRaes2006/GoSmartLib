<nav class="navbar">
  <div class="nav-left">
    <a [routerLink]="homeRoute" class="logo-link">
      <div class="go-badge">GO!</div>
      <span class="logo-text">SmartLib</span>
    </a>
  </div>

  <div class="nav-right">
    @if (isDevMode) {
      <label class="dev-role-switcher" title="Dev-mode: wissel van rol">
        <span class="dev-role-label">DEV</span>
        <select [value]="huidigeDevRole" (change)="wisselDevRole($event)">
          <option value="STUDENT">STUDENT</option>
          <option value="TEACHER">TEACHER</option>
          <option value="BEHEERDER">BEHEERDER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </label>
      <div class="divider"></div>
    }

    <button
      class="dyslexia-toggle"
      [class.active]="isDyslexieActief"
      (click)="toggleDyslexie()"
      title="Zet dyslexie lettertype aan/uit"
    >
      <span class="toggle-text">Leeshulp</span>
      <div class="switch-track">
        <div class="switch-knob"></div>
      </div>
    </button>

    <div class="divider"></div>

    <a routerLink="/leeslijst" class="nav-link">
      <span class="text-label">Mijn lijsten</span>
    </a>

    <a routerLink="/reserveren" class="nav-link cart-link">
      <span class="icon">🛒</span>
      @if (aantalInMandje > 0) {
        <span class="cart-badge">{{ aantalInMandje }}</span>
      }
    </a>

    <a routerLink="/leengeschiedenis" class="nav-icon-btn" title="Mijn Profiel">
      <span class="icon">👤</span>
    </a>

    <button class="nav-icon-btn logout-btn" title="Uitloggen" (click)="logout()">
      <span class="icon">➜]</span>
    </button>
  </div>
</nav>
