<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina niet gevonden | GO! SmartLib</title>
    <link rel="stylesheet" href="page-not-found.css">
</head>
<body>

    <nav class="navbar">
      </nav>


    <main class="page-not-found-container">
        <div class="not-found-card">
            
            <div class="icon-area">
                <span class="emoji">🕵️‍♂️</span> 
            </div>
            
            <div class="text-area">
                <h1 class="error-code">404</h1>
                <h2 class="error-message">Oeps! Deze pagina is gaan vliegen.</h2>
                <p class="error-description">
                    Het lijkt erop dat de pagina die je zoekt niet meer bestaat, 
                    verhuisd is, of dat er een typfoutje in de URL is geslopen. 
                    Geen paniek, we helpen je graag terug op weg!
                </p>
            </div>

            <div class="actions">
                <a href="/" class="btn-primary">Terug naar homepage</a>
                <a href="/catalogus" class="btn-secondary">Naar de catalogus</a>
            </div>
            
        </div>
    </main>

</body>
</html>
