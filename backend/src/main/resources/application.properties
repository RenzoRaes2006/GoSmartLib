spring.application.name=backend

# Laad secrets uit .env (in dezelfde dir waar de JVM gestart wordt: backend/.env).
# `optional:` voorkomt dat de app crasht als het bestand er nog niet is.
spring.config.import=optional:file:./.env[.properties]

# Verbinding met je lokale MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/schooldb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate instellingen voor een echte database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL Logging (handig om te zien of tabellen worden aangemaakt)
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# OAuth2 / Security debug logging (alleen aanzetten bij debuggen Smartschool-flow!
# TRACE-niveau lekt access tokens in de console -> niet aanlaten in productie)
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.oauth2=TRACE
#logging.level.org.springframework.web.client.RestTemplate=DEBUG

# Image upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
upload.path=uploads/covers
upload.path.lesmateriaal=uploads/lesmateriaal

server.port=8081


# Registratie van de Smartschool client
spring.security.oauth2.client.registration.smartschool.client-id=${SMARTSCHOOL_CLIENT_ID}
spring.security.oauth2.client.registration.smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET}
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.redirect-uri={baseUrl}/login/oauth2/code/smartschool
spring.security.oauth2.client.registration.smartschool.scope=userinfo

# URL's van de Smartschool omgeving
spring.security.oauth2.client.provider.smartschool.authorization-uri=https://oauth.smartschool.be/OAuth/index/authorize
spring.security.oauth2.client.provider.smartschool.token-uri=https://oauth.smartschool.be/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://oauth.smartschool.be/Api/V1/userinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=userID

# De basis URL van de Angular frontend
app.frontend.url=https://frontend-sp09.cloud-ap.be/

# CORS allowed origins (comma-separated). Override per omgeving (dev/prod).
app.cors.allowed-origins=http://localhost:4200,https://localhost:4200,https://frontend.localhost,https://frontend-sp09.cloud-ap.be,https://api-sp09.cloud-ap.be

# Achter reverse proxy (Traefik): laat Spring correcte https:// URL's genereren
server.forward-headers-strategy=framework


# JWT secret key (moet nog aangepast worden naar een echte geheime sleutel in productie)
app.jwt.secret=dit_is_een_zeer_geheime_sleutel_voor_gosmartbib_die_lang_genoeg_is

# ----------------------------------------
# OneRoster API configuratie
# ----------------------------------------
# Vraag deze gegevens op bij de school of de Smartschool-beheerder.
# base-url: de basis-URL van de OneRoster API, eindigend op de versie (v1p1)
# username + password: de credentials voor Basic Auth toegang
# ----------------------------------------
oneroster.base-url=https://aphogeschool.smartschool.be/ims/oneroster/v1p1
oneroster.token-url=https://aphogeschool.smartschool.be/ims/oneroster/token
oneroster.username=${ONEROSTER_USERNAME}
oneroster.password=${ONEROSTER_PASSWORD}

# Welke OneRoster client de wizard gebruikt: 'mock' (default) of 'live'
gosmartlib.oneroster.mode=live

# Notificatie-mode voor te-laat-mails naar Smartschool-inbox.
# 'log' (default) = enkel loggen, geen echte SOAP-call (handig voor demo zonder API-key).
# 'soap' = echte sendMsg-call naar Smartschool webservice (vereist API-key per school).
gosmartlib.notificatie.mode=soap