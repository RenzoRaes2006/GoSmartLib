spring.application.name=backend

# Verbinding met je lokale MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/schooldb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate instellingen voor een echte database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL Logging (handig om te zien of tabellen worden aangemaakt)
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# Image upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.path=uploads/covers

server.port=8081