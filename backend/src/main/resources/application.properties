spring.application.name=backend

# Verbinding met je lokale MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/schooldb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate instellingen voor een echte database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL Logging (handig om te zien of tabellen worden aangemaakt)
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# Image upload configuration                
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB   
upload.path=uploads/covers

server.port=8081


# Registratie van de Smartschool client
spring.security.oauth2.client.registration.smartschool.client-id=2ebf496d131b
spring.security.oauth2.client.registration.smartschool.client-secret=164db600cdac
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.redirect-uri={baseUrl}/login/oauth2/code/smartschool

# URL's van de Smartschool omgeving
spring.security.oauth2.client.provider.smartschool.authorization-uri=https://oauth.smartschool.be/OAuth/index/authorize
spring.security.oauth2.client.provider.smartschool.token-uri=https://oauth.smartschool.be/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://oauth.smartschool.be/Api/V1/userinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=id

# De basis URL van de Angular frontend
app.frontend.url=https://frontend-sp09.cloud-ap.be/

# Achter reverse proxy (Traefik): laat Spring correcte https:// URL's genereren
server.forward-headers-strategy=framework


# JWT secret key (moet nog aangepast worden naar een echte geheime sleutel in productie)
app.jwt.secret=dit_is_een_zeer_geheime_sleutel_voor_gosmartbib_die_lang_genoeg_is