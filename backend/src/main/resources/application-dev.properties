# Dev-profiel: lokaal testen zonder Smartschool-login.
# Activeer met: -Dspring.profiles.active=dev
# DevAuthFilter zet automatisch een testgebruiker (ROLE_BEHEERDER) in de SecurityContext.
# Override per request via headers:
#   X-Dev-User: <smartschoolId>
#   X-Dev-Role: STUDENT | TEACHER | BEHEERDER

app.frontend.url=http://localhost:4200/
app.cors.allowed-origins=http://localhost:4200,https://localhost:4200
