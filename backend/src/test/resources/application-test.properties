spring.datasource.url=jdbc:h2:mem:gosmartlib;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# upload-pad naar tijdelijke map zodat ImageController-tests geen rechten nodig hebben
upload.path=${java.io.tmpdir}/gosmartlib-test-uploads

# Smartschool OAuth dummy credentials zodat de auto-config niet faalt
spring.security.oauth2.client.registration.smartschool.client-id=test-client
spring.security.oauth2.client.registration.smartschool.client-secret=test-secret
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.redirect-uri={baseUrl}/login/oauth2/code/smartschool
spring.security.oauth2.client.registration.smartschool.scope=userinfo
spring.security.oauth2.client.provider.smartschool.authorization-uri=https://oauth.smartschool.be/OAuth/index/authorize
spring.security.oauth2.client.provider.smartschool.token-uri=https://oauth.smartschool.be/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://oauth.smartschool.be/Api/V1/userinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=userID

# Dummy OneRoster en JWT secrets
oneroster.base-url=http://localhost/ims/oneroster/v1p1
oneroster.token-url=http://localhost/ims/oneroster/token
oneroster.username=test
oneroster.password=test
app.jwt.secret=dit_is_een_test_secret_key_voor_gosmartbib_die_lang_genoeg_is
app.frontend.url=http://localhost:4200/
