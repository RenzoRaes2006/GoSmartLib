services:
  mysqldb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: schooldb
    ports:
      - "3307:3306"
    networks:
      - proxy
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/schooldb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    labels:
      - "traefik.enable=true"
      # - "traefik.http.routers.backend.rule=Host(`frontend.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.rule=(Host(`frontend-sp09.cloud-ap.be`) || Host(`api-sp09.cloud-ap.be`) || Host(`frontend.localhost`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      # - "traefik.http.routers.backend.middlewares=strip-api"
      # - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"
    volumes:
      - uploads_data:/app/uploads/covers
    networks:
      - proxy

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8080
    labels:
      - "traefik.enable=true"
      # - "traefik.http.routers.frontend.rule=Host(`frontend.localhost`)"
      - "traefik.http.routers.frontend.rule=Host(`frontend-sp09.cloud-ap.be`) || Host(`frontend.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
      external: true

volumes:
  mysql_data:
  uploads_data:
